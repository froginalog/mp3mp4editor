name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      # Kotlin errors are otherwise buried thousands of lines above the Gradle stacktrace.
      - name: Compiler errors
        if: failure()
        run: grep -E "^e: |^ERROR:|Duplicate class" build.log | head -60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mp3mp4editor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
