name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      # Kotlin errors are otherwise buried thousands of lines above the Gradle stacktrace.
      - name: Compiler errors
        if: failure()
        run: |
          grep -E "^e: |^ERROR:|Duplicate class" build.log | head -60 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mp3mp4editor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # A rolling release so the APK has a stable, direct download link that a phone browser can
      # open — Actions artifacts are login-gated zips, which phones handle badly.
      - name: Publish rolling debug release
        if: github.ref_name == 'claude/youtube-export-android-app-f9wsiq'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" mp3mp4editor-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest mp3mp4editor-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Debug build" \
            --notes "Debug APK built from $GITHUB_SHA. Unsigned debug build for sideloading."
